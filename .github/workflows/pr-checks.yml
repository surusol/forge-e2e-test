name: PR checks

# Guardrails that run on every pull request. Fast, no code dependencies, runs on
# GitHub-hosted runners so it works even if a self-hosted runner is offline.
# Replace FTEST with the Jira project key (e.g. WID) when scaffolding.
#
# WHY ONE JOB AND NOT SIX. GitHub bills Actions PER JOB, rounded up to the
# nearest minute. These checks are greps that finish in 2-5 seconds each — as six
# separate jobs that is ~20 seconds of work billed as SIX MINUTES, on every pull
# request, in every governed repo, forever. As one job with six steps it is one
# minute. Steps do not round up; only jobs do.
#
# What is lost is five entries in the checks list. What is kept is the diagnosis:
# every check still emits its own ::error title=...:: annotation, so a failure is
# still named in the UI, and the run reports ALL failures rather than stopping at
# the first — see `continue-on-error` on each step and the summary gate at the end.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  metadata:
    name: PR metadata (key, requirement, ADR, checklist, narrative)
    runs-on: ubuntu-latest
    # Dependabot cannot satisfy these: it has no Jira card, no requirement, and
    # writes its own body. Without an exemption every governed repo accumulates
    # permanently unmergeable dependency PRs, security ones included.
    #
    # NOTE: the PR AUTHOR, not github.actor. github.actor is whoever triggered the
    # CURRENT event, so the moment a human reopens or re-runs a Dependabot PR the
    # exemption evaporates and the PR becomes unmergeable again. Verified: a
    # manual reopen turned every check red. The author is stable for the PR's life.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Jira issue key
        id: key
        continue-on-error: true
        run: |
          # This matches the Jira Automation rules EXACTLY: they transition a card
          # only when the PR title STARTS WITH "FTEST-<n>:". A title that
          # merely CONTAINS the key matches no rule, so the card silently never
          # moves — a board that quietly stops describing reality is worse than one
          # that fails loudly, which is why this is strict about position.
          fail=0
          if echo "$PR_TITLE" | grep -qE '^FTEST-[0-9]+: .'; then
            TITLE_KEY=$(echo "$PR_TITLE" | grep -oE '^FTEST-[0-9]+')
            echo "OK — title starts with $TITLE_KEY:"
          else
            TITLE_KEY=""
            echo "::error title=PR title must start with the key::The title must begin with 'FTEST-<n>: ' followed by a summary — e.g. 'FTEST-12: saved-search storage'. The Jira rules match on the title STARTING WITH the key, so any other shape leaves the card stuck with nothing reporting it (CONTRIBUTING.md §4)."
            fail=1
          fi
          if echo "$HEAD_REF" | grep -qE 'FTEST-[0-9]+'; then
            BRANCH_KEY=$(echo "$HEAD_REF" | grep -oE 'FTEST-[0-9]+' | head -1)
            echo "OK — branch carries $BRANCH_KEY"
          else
            BRANCH_KEY=""
            echo "::error title=Branch missing the key::The branch must be named <type>/FTEST-<n>-<slug> (CONTRIBUTING.md §4)."
            fail=1
          fi
          if [ -n "$TITLE_KEY" ] && [ -n "$BRANCH_KEY" ] && [ "$TITLE_KEY" != "$BRANCH_KEY" ]; then
            echo "::error title=Title and branch name different cards::Title says $TITLE_KEY, branch says $BRANCH_KEY. The automation follows the title; a reviewer reads the branch. Make them agree."
            fail=1
          fi
          echo "MY_KEY=${TITLE_KEY:-$BRANCH_KEY}" >> "$GITHUB_ENV"
          exit $fail

      - name: Only this card's key
        id: stray
        continue-on-error: true
        run: |
          # A PR is linked to EVERY issue key it mentions — branch, title, body or
          # commit — and the merge automation transitions all of them. Mentioning
          # another card here closes work nobody did. pre-pr-check.sh covers the
          # commits; this covers the two surfaces it cannot see from inside a clone.
          # It matters doubly under squash merges, where GitHub composes the commit
          # message from the title and body.
          if [ -z "$MY_KEY" ]; then echo "No key found — reported above."; exit 0; fi
          ALL=$(printf '%s' "$PR_TITLE $PR_BODY" | grep -oE 'FTEST-[0-9]+' | sort -u || true)
          STRAY=$(printf '%s' "$ALL" | grep -vFx "$MY_KEY" || true)
          if [ -n "$STRAY" ]; then
            echo "::error title=Another card would be closed::This PR mentions $(echo "$STRAY" | tr '\n' ' ')in its title or body. Every key a PR mentions is linked and transitioned on merge, so merging this would close work nobody did. To refer to other work, describe it in words ('the CI-pipeline card'). To record a real dependency, add an issue link on the Jira card itself (Blocks / Relates to) — that is what the link field is for, and unlike prose it transitions nothing."
            exit 1
          fi
          echo "OK — references only $MY_KEY."

      - name: Requirement reference
        id: req
        continue-on-error: true
        run: |
          if echo "$PR_BODY" | grep -qE '\bR[0-9]+\b'; then
            echo "OK — found a requirement reference."
          else
            echo "::error title=Missing requirement reference::The PR body must name the requirement it serves (e.g. R3), per CONTRIBUTING.md §5."
            exit 1
          fi

      - name: Decision record reference
        id: adr
        continue-on-error: true
        run: |
          # The point is not that every PR has an ADR — most legitimately do not.
          # The point is that the author had to answer the question consciously, in
          # writing, before the change could land.
          if echo "$PR_BODY" | grep -qiE 'ADR-[0-9]{4}'; then
            echo "OK — references $(echo "$PR_BODY" | grep -oiE 'ADR-[0-9]{4}' | sort -u | tr '\n' ' ')"
          elif echo "$PR_BODY" | grep -qiE '^\s*ADR:.*\bN/?A\b'; then
            echo "OK — explicitly declared N/A."
            if ! echo "$PR_BODY" | grep -qiE '^\s*ADR:.*N/?A\b.{10,}'; then
              echo "::warning title=Bare N/A::'ADR: N/A' should say why in a few words."
            fi
          else
            echo "::error title=Missing decision record::The PR body must name the ADR it implements (ADR-0007) or state 'ADR: N/A — <reason>'. Decision-shaped changes (dependencies, schemas, boundaries, auth, hosting) need an ADR — see docs/adr/0000-record-architecture-decisions.md."
            exit 1
          fi

      - name: Checklist complete
        id: checklist
        continue-on-error: true
        run: |
          # An unticked box is an unanswered question, not a formality.
          UNTICKED=$(echo "$PR_BODY" | grep -cE '^\s*- \[ \]' || true)
          TICKED=$(echo "$PR_BODY" | grep -ciE '^\s*- \[x\]' || true)
          echo "checklist: $TICKED ticked, $UNTICKED unticked"
          if [ "$UNTICKED" -gt 0 ]; then
            echo "$PR_BODY" | grep -E '^\s*- \[ \]' | sed 's/^/  /'
            echo "::error title=Incomplete checklist::$UNTICKED checklist item(s) are unticked. Tick each one only if it is actually true — if an item does not apply, strike it through and say why (~~item~~ n/a: reason)."
            exit 1
          fi
          if [ "$TICKED" -eq 0 ]; then
            echo "::error title=Checklist missing::The PR body has no checklist. Use the PR template (.github/pull_request_template.md)."
            exit 1
          fi
          echo "OK — checklist complete."

      - name: Reviewable narrative
        id: narrative
        continue-on-error: true
        run: |
          # The reviewer's cheapest useful rung. When most code is written by an
          # LLM a human cannot read every diff, so the PR must carry a plain-
          # language account of what changed and the NAMED tests that prove it.
          # An unreadable PR is an unreviewable one.
          fail=0
          section() {
            printf '%s\n' "$PR_BODY" \
              | awk -v pat="$1" '
                  /^##[[:space:]]/ { inside = ($0 ~ pat) ? 1 : 0; next }
                  inside { print }'
          }
          WHAT=$(section '[Ww]hat *& *why' | sed 's/<!--.*-->//' | grep -vE '^\s*(<!--|-->)?\s*$' || true)
          WORDS=$(printf '%s' "$WHAT" | wc -w)
          echo "narrative: $WORDS words under 'What & why'"
          if [ "$WORDS" -lt 20 ]; then
            echo "::error title=Narrative too thin::The 'What & why' section has $WORDS words. Explain in plain language what changed and why, so a reviewer can judge it without reading the whole diff. Aim for 20+ words."
            fail=1
          fi
          TESTED=$(section '[Hh]ow it was tested' | sed 's/<!--.*-->//' | grep -vE '^\s*(<!--|-->)?\s*$' || true)
          if [ -z "$TESTED" ]; then
            echo "::error title=No test evidence::The 'How it was tested' section is empty. Name the tests that prove this change."
            fail=1
          elif ! printf '%s' "$TESTED" | grep -qE '[A-Za-z0-9_]+[._/-][A-Za-z0-9_/.-]+|\b(test|spec|scenario|Scenario)[_A-Za-z0-9]*\b'; then
            echo "::error title=Tests not named::'How it was tested' must name the tests (e.g. test_reorder_threshold, features/limits.feature:12). 'Ran it locally' is not test evidence — it is not repeatable and nobody else can check it."
            fail=1
          else
            echo "OK — test evidence names identifiable tests."
          fi
          exit $fail

      - name: Summary
        # Every step above is continue-on-error so the author sees ALL the
        # problems in one run rather than fixing them one push at a time. This
        # step is what actually fails the job.
        run: |
          bad=""
          for s in "key:${{ steps.key.outcome }}" "stray:${{ steps.stray.outcome }}" \
                   "requirement:${{ steps.req.outcome }}" "adr:${{ steps.adr.outcome }}" \
                   "checklist:${{ steps.checklist.outcome }}" "narrative:${{ steps.narrative.outcome }}"; do
            case "$s" in *:failure) bad="$bad ${s%%:*}" ;; esac
          done
          if [ -n "$bad" ]; then
            echo "::error title=PR metadata incomplete::Failed:$bad. Each is annotated above with what to fix."
            exit 1
          fi
          echo "All PR metadata checks passed."
