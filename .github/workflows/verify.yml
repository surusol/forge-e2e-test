name: Verify

# The blocking gate. Runs the SAME script as the local pre-push hook
# (scripts/pre-pr-check.sh), so "passes locally" and "passes CI" cannot mean
# two different things. Stack-specific commands come from .forge/config, which
# is why this workflow needs no per-project edits.
#
# This job MUST be in the branch-protection required-status-checks list, or it
# reports without preventing anything. setup_github.sh adds it.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (tests, docs, decisions)
    runs-on: ubuntu-latest
    steps:
      # Full history: the script diffs against the merge-base with the base branch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Uncomment and adapt the toolchain your TEST_CMD needs, e.g.:
      # - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
      #   with: { go-version-file: go.mod }

      - name: Fetch the base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      - name: Run the PR gate
        env:
          FORGE_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          chmod +x scripts/pre-pr-check.sh
          ./scripts/pre-pr-check.sh --ci
